# Non-secret settings only. Private user hashes and keys live in .auth/.
server:
  address: 'tcp://:9091/auth'
  # Use Compose's HTTP health check; skip writing the image's legacy env file.
  disable_healthcheck: true
theme: 'light'
totp:
  disable: false
  issuer: 'Portfolio Authelia'
webauthn:
  disable: true
log:
  level: 'info'
authentication_backend:
  refresh_interval: 1m
  password_reset:
    disable: true
  file:
    path: '/secrets/directory/users.yml'
    watch: true
    password:
      algorithm: 'argon2'
      argon2:
        iterations: 3
        memory: 65536
        parallelism: 1
access_control:
  default_policy: 'deny'
  rules:
    - domain: 'rakazo.144.24.135.201.sslip.io'
      subject: ['user:rithvik']
      policy: 'two_factor'
    - domain: '{{ env "DOMAIN" }}'
      resources: ['^/dashboard/(guide/)?$']
      policy: 'two_factor'
    - domain: '{{ env "DOMAIN" }}'
      resources: ['^/admin(/.*)?$', '^/portainer(/.*)?$']
      subject: ['group:admins']
      policy: 'two_factor'
    - domain: 'ntfy.144.24.135.201.sslip.io'
      subject: ['group:admins']
      policy: 'two_factor'
session:
  name: 'workspace_session'
  same_site: 'lax'
  inactivity: '30m'
  expiration: '8h'
  remember_me: -1
  cookies:
    - domain: '{{ env "DOMAIN" }}'
      authelia_url: 'https://{{ env "DOMAIN" }}/auth/'
      default_redirection_url: 'https://{{ env "DOMAIN" }}/admin/'
    - domain: 'ntfy.144.24.135.201.sslip.io'
      authelia_url: 'https://ntfy.144.24.135.201.sslip.io/auth/'
      default_redirection_url: 'https://ntfy.144.24.135.201.sslip.io/'
    - domain: 'rakazo.144.24.135.201.sslip.io'
      authelia_url: 'https://rakazo.144.24.135.201.sslip.io/auth/'
      default_redirection_url: 'https://rakazo.144.24.135.201.sslip.io/'
regulation:
  max_retries: 5
  find_time: '2m'
  ban_time: '10m'
storage:
  local:
    path: '/data/db.sqlite3'
notifier:
  filesystem:
    filename: '/data/notifications.txt'

identity_providers:
  oidc:
    hmac_secret: '{{ secret "/secrets/oidc-hmac" }}'
    jwks:
      - algorithm: 'RS256'
        use: 'sig'
        key: {{ secret "/secrets/oidc-private.pem" | mindent 10 "|" | msquote }}
    lifespans:
      custom:
        omniroute_edge:
          access_token: '5m'
          id_token: '5m'
          refresh_token: '30m'
    claims_policies:
      omniroute_edge_identity:
        id_token: ['email', 'email_verified', 'groups']
      omniroute_identity:
        # OmniRoute validates admission from the ID token, not userinfo.
        id_token: ['email', 'email_verified']
    authorization_policies:
      infrastructure_admins:
        default_policy: 'deny'
        rules:
          - policy: 'two_factor'
            subject: ['group:admins']
      notes_members:
        default_policy: 'deny'
        rules:
          - policy: 'two_factor'
            subject: ['group:admins', 'group:notes']
      vault_members:
        default_policy: 'deny'
        rules:
          - policy: 'two_factor'
            subject: ['group:admins', 'group:vault']
    clients:
      - client_id: 'portfolio-portainer'
        client_name: 'Portainer'
        client_secret: '{{ secret "/secrets/portainer-client-hash" }}'
        public: false
        authorization_policy: 'infrastructure_admins'
        consent_mode: 'implicit'
        require_pkce: false
        redirect_uris: ['https://{{ env "DOMAIN" }}/portainer/']
        scopes: ['openid', 'profile', 'groups', 'email']
        response_types: ['code']
        grant_types: ['authorization_code']
        access_token_signed_response_alg: 'none'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_post'
      - client_id: 'portfolio-kuma'
        client_name: 'Uptime Kuma'
        client_secret: '{{ secret "/secrets/kuma-client-hash" }}'
        public: false
        authorization_policy: 'infrastructure_admins'
        consent_mode: 'implicit'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris: ['https://uptime.144.24.135.201.sslip.io/oauth2/callback']
        scopes: ['openid', 'profile', 'email', 'groups']
        response_types: ['code']
        grant_types: ['authorization_code']
        token_endpoint_auth_method: 'client_secret_basic'
      - client_id: 'portfolio-notes-edge'
        client_name: 'notes-edge'
        client_secret: '{{ secret "/secrets/notes-edge-client-hash" }}'
        public: false
        authorization_policy: 'notes_members'
        consent_mode: 'implicit'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris: ['https://notes.144.24.135.201.sslip.io/oauth2/callback']
        scopes: ['openid', 'profile', 'email', 'groups']
        response_types: ['code']
        grant_types: ['authorization_code']
        token_endpoint_auth_method: 'client_secret_basic'
      - client_id: 'portfolio-notes'
        client_name: 'notes'
        client_secret: '{{ secret "/secrets/notes-client-hash" }}'
        public: false
        authorization_policy: 'notes_members'
        consent_mode: 'implicit'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris: ['https://notes.144.24.135.201.sslip.io/auth/oidc.callback']
        scopes: ['openid', 'profile', 'email', 'groups']
        response_types: ['code']
        grant_types: ['authorization_code']
        token_endpoint_auth_method: 'client_secret_post'
      - client_id: 'portfolio-vault-edge'
        client_name: 'vault-edge'
        client_secret: '{{ secret "/secrets/vault-edge-client-hash" }}'
        public: false
        authorization_policy: 'vault_members'
        consent_mode: 'implicit'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris: ['https://vault.144.24.135.201.sslip.io/oauth2/callback']
        scopes: ['openid', 'profile', 'email', 'groups']
        response_types: ['code']
        grant_types: ['authorization_code']
        token_endpoint_auth_method: 'client_secret_basic'
      - client_id: 'portfolio-vault'
        client_name: 'vault'
        client_secret: '{{ secret "/secrets/vault-client-hash" }}'
        public: false
        authorization_policy: 'vault_members'
        consent_mode: 'implicit'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris: ['https://vault.144.24.135.201.sslip.io/identity/connect/oidc-signin']
        scopes: ['openid', 'profile', 'email', 'groups']
        response_types: ['code']
        grant_types: ['authorization_code']
        token_endpoint_auth_method: 'client_secret_basic'
      - client_id: 'portfolio-omniroute-edge'
        lifespan: 'omniroute_edge'
        claims_policy: 'omniroute_edge_identity'
        client_name: 'OmniRoute-edge'
        client_secret: '{{ secret "/secrets/omniroute-edge-client-hash" }}'
        public: false
        authorization_policy: 'infrastructure_admins'
        consent_mode: 'implicit'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris: ['https://models.144.24.135.201.sslip.io/oauth2/callback']
        scopes: ['openid', 'profile', 'email', 'groups', 'offline_access']
        response_types: ['code']
        grant_types: ['authorization_code', 'refresh_token']
        token_endpoint_auth_method: 'client_secret_basic'
      - client_id: 'portfolio-omniroute'
        claims_policy: 'omniroute_identity'
        client_name: 'OmniRoute'
        client_secret: '{{ secret "/secrets/omniroute-client-hash" }}'
        public: false
        authorization_policy: 'infrastructure_admins'
        consent_mode: 'implicit'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris: ['https://models.144.24.135.201.sslip.io/api/auth/oidc/callback']
        scopes: ['openid', 'profile', 'email', 'groups']
        response_types: ['code']
        grant_types: ['authorization_code']
        token_endpoint_auth_method: 'client_secret_post'
