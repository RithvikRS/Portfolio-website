name: Publish dashboard logout clients
on:
  push:
    branches: [V2]
    paths:
      - deploy/service-clients/**
      - .github/workflows/service-clients.yml
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        target: [kuma, vault]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Log in to the existing registry
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: deploy/service-clients
          platforms: linux/amd64,linux/arm64
          target: ${{ matrix.target }}
          tags: ghcr.io/rithvikrs/portfolio-website:${{ matrix.target }}-${{ github.sha }}
          push: true
