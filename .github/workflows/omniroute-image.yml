name: Publish OmniRoute display customization
on:
  push:
    branches: [V2, 'codex/omniroute-*']
    paths:
      - deploy/omniroute/**
      - tests/omniroute-cost-labels.test.mjs
      - .github/workflows/omniroute-image.yml
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Test cost labels
        run: node --test tests/omniroute-cost-labels.test.mjs
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Log in to registry
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: image
        with:
          context: deploy/omniroute
          platforms: linux/arm64
          tags: ghcr.io/rithvikrs/portfolio-website:omniroute-costs-${{ github.sha }}
          push: true
      - name: Report immutable image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "OmniRoute image digest $DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
