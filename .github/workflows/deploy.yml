name: Deploy portfolio

on:
  # Use main's workflow and ref; avoid the public pull_request_target policy.
  push:
    branches: [main]

permissions: {}

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  merged-pr:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      pull-requests: read
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
    steps:
      - name: Require a merged PR for this main commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, time
          from urllib.request import Request, urlopen

          def eligible(pr):
              return (pr.get('merged_at') is not None
                      and pr.get('merge_commit_sha') == os.environ['GITHUB_SHA']
                      and pr.get('base', {}).get('ref') == 'main'
                      and pr.get('base', {}).get('repo', {}).get('full_name') == os.environ['GITHUB_REPOSITORY'])

          matched = False
          for attempt in range(3):
              for page in range(1, 11):
                  url = (f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
                         f"/commits/{os.environ['GITHUB_SHA']}/pulls?per_page=100&page={page}")
                  request = Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2026-03-10'})
                  with urlopen(request, timeout=20) as response:
                      prs = json.load(response)
                  matched = any(eligible(pr) for pr in prs)
                  if matched or len(prs) < 100:
                      break
              else:
                  raise RuntimeError('PR lookup exceeded its page limit; deployment refused.')
              if matched:
                  break
              if attempt < 2:
                  time.sleep(5)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('eligible=' + str(matched).lower() + '\n')
          print('Merged PR confirmed.' if matched else 'No matching merged PR; skip production deployment.')
          PY

  deploy:
    needs: merged-pr
    if: needs.merged-pr.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production

    steps:
      - name: Deploy to Oracle AMD
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          : "${SSH_HOST:?Missing SSH_HOST}"
          : "${SSH_USER:?Missing SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing SSH_KNOWN_HOSTS}"

          ssh_dir="$(mktemp -d)"
          trap 'rm -rf -- "$ssh_dir"' EXIT

          printf '%s\n' "$SSH_PRIVATE_KEY" |
            tr -d '\r' > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" |
            tr -d '\r' > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"

          ssh -T \
            -i "$ssh_dir/key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "$SSH_USER@$SSH_HOST" \
            'bash /opt/portfolio/portfolio_redeploy.sh'
