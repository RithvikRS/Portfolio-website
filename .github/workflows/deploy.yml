name: Deploy portfolio

on:
  # Use the trusted main branch context so production's main-only rule applies.
  # Never check out or execute an unmerged PR's code in this workflow.
  pull_request_target:
    branches: [main]
    types: [closed]

permissions: {}

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production

    steps:
      - name: Deploy to Oracle AMD
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          : "${SSH_HOST:?Missing SSH_HOST}"
          : "${SSH_USER:?Missing SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing SSH_KNOWN_HOSTS}"

          ssh_dir="$(mktemp -d)"
          trap 'rm -rf -- "$ssh_dir"' EXIT

          printf '%s\n' "$SSH_PRIVATE_KEY" |
            tr -d '\r' > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" |
            tr -d '\r' > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"

          ssh -T \
            -i "$ssh_dir/key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "$SSH_USER@$SSH_HOST" \
            'bash /opt/portfolio/portfolio_redeploy.sh'
